<style>
    @charset "UTF-8";
    *{margin: 0; }
    body{cursor: Default}
    
   .container{
		width: 370px;
        height: 100%;
		display: flex;
		flex-direction: row;
		flex-wrap: wrap;
		justify-content:center;
        position: absolute;
        top: -5px; left: 2px;
        padding: 15px;
	}

	.D1colunaA{
       	width: 70%;
		height: 100%;
		display: flex;
		flex-direction: column;
		justify-content: flex-start;
		align-items: flex-end;
        /* background-color: rgb(167, 138, 170); */
	}
	.coluna_B{
        width:22%;
        height: 200px;
        display: flex;
        flex-direction: column;
        padding:0px;
        align-items: center;
        margin-left: 20px;
	}

    .paineis{
		width: 70%;
		height: 100%;
		background: #575757;
		border-radius:5px; 
		display: flex;
		flex-direction: column;
		align-items: center;
        
		border:  1px solid rgb(65, 65, 65); 
		padding: 5px;
    }

    .label-titulos{
        color: rgb(216, 216, 216);
        font-size: 11px;
        margin-bottom:5px ;
    }

    .alerta{
        position: absolute; top:153px; left: 35px;
        background: #7e3838;
        padding: 5px; color: #d4cfcf;
        border:  1px solid rgb(146, 146, 146); 
        border-radius:3px; 
        display: none;
    }

    .grupoItens{
        margin: 0;
        display: flex;
        margin-top: 5px;
    }

    .Edit-text-config{
        width: 41px;
        height: 21px;
        margin: 0px;
        padding: 2px;
        background-color: #353434;
        border: none;
	}

    .colorBtn {
        background-color: #686868;
        color: white;
        cursor: pointer;
        font-size: 10px;
        width: 22px;
        height: 22px;
        margin:2px; 
    }

    .textoConfig{
        color: #d4cfcf;
    }

    .btnMedio:hover .textoConfig{	
         color: rgb(0, 0, 0);
    }

    .btnMedio:hover .icon-tnAcordion{	
         color: rgb(0, 0, 0);
    }

    .disabled{ display: none;}

    .label-txtRadios{
        color: #a0a0a0;
        pointer-events: none; 
    }

    .radiobtnFB{
		margin: 0px;
	}
	.sp-radio-txt{
		font-size: 11px;
		font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
		transform: translate(-5px,2px);
	}

    .D1aimg_main {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: auto;
        padding: 10px;
        border: 1px solid rgb(65, 65, 65);
        border-radius: 10px;
        background-color: #615f5f;
    }

    .D1aimg_Container {
        width: 100%;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        align-items: center;
        border: 1px solid rgb(65, 65, 65);
        padding: 10px;
    }

    .label-Desabilitadox{
        color: #8b8a8a;
        pointer-events: none; 
    }

    .btnSeel{
        background:#96b89e;
        color: rgb(0, 0, 0);
        transform: translate(0px, 0px);
        border-top: 3px solid #232323;
    }

    .txtColor{
        color: #88f0a0;
    }
