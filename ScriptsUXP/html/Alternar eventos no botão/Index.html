<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <button id="meuBotao">Alternar Funções</button>
  
</body>

<script>
        var funcao1 = function() {
          console.log("Função 1");
          document.querySelector("#meuBotao").style.backgroundColor = "#ff9e9e "   //background-color: ; 
          document.querySelector("#meuBotao").textContent = "Vermelho"
        };
        
        var funcao2 = function() {
          console.log("Função 2");
          document.querySelector("#meuBotao").style.backgroundColor = "#acff9e"   //background-color: ; 
          document.querySelector("#meuBotao").textContent = "Verde Claro"
        };
        
        var alternarFuncoes = function() {
          if (this.classList.contains("funcao1")) {
             funcao2(); this.classList.remove("funcao1"); this.classList.add("funcao2"); 
            }
           else { funcao1();  this.classList.remove("funcao2"); this.classList.add("funcao1");}
        };
        
        var meuBotao = document.getElementById("meuBotao");
        meuBotao.addEventListener("click", alternarFuncoes);
</script>

</html>
