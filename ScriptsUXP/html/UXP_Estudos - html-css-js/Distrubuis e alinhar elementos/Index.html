<!doctype html>
<html lang="pt-br">
<head>

    <title>Document</title>

<style>
	.container-botoes { 
		width: 300px; 
		height:200px;
		display:block;

	.botoes{

		border: 1px solid #232323;
		float: left;
		color:#000000;
		font-family: Arial, Helvetica, sans-serif;
		font-size: 11px;
		text-align:center; /*Alina o texto horizontalmente*/
		line-height: 25px; /*Alina o texto verticalmente*/
		transform: translate(2.5px, 0px)
	}
</style>

<body>
    <div class='container-botoes'>
