<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrastar e Soltar Imagem</title>
    <style>
        #dropZone {
            width: 300px;
            height: 200px;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            text-align: center;
            color: #999;
        }

        #dropZone img {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div id="dropZone">Arraste uma imagem para cá</div>
    <script>
        const dropZone = document.getElementById('dropZone');

        // Impede o comportamento padrão de arrastar e soltar
        dropZone.addEventListener('dragover', (event) => {
            event.preventDefault();
            dropZone.style.borderColor = 'green';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#ccc';
        });

        // Lida com o evento de soltar o arquivo
        dropZone.addEventListener('drop', (event) => {
            event.preventDefault();
            dropZone.style.borderColor = '#ccc';

            const files = event.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        dropZone.innerHTML = '';
                        dropZone.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                } else {
                    alert('Por favor, solte uma imagem.');
                }
            }
        });
    </script>
</body>
</html>
