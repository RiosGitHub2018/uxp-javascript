<!DOCTYPE html>
<html>
<head>
    <script src="index.js"></script>    
    <link  href="css/style.css" rel="stylesheet" type="text/css">
</head>

<style>
    @charset "UTF-8";
   *{margin: 0; }

   .main{
       width: 100px;
       flex-direction: column;
       align-items: center;
       border:  1px solid rgb(58, 58, 58); 
       border-radius: 0px; 
        padding: 2px; 
       overflow-y: scroll; height: 121px;
    }

   .allbuttons{
       width: 100%;
       height: 20px;
       color: rgb(167, 167, 164);

   }
   
   .black { background-color: black; }
   .branco { background-color: red; }

</style>


<body>

   <div class="main" id="container"></div> 
   <h2 class="allbuttons" id="result">Item 1</h2>
   
</body>

<script>

const container = document.getElementById('container');
const result = document.getElementById('result');

container.addEventListener('click', handleClick);

const textBtns = [ 'Item 1', 'Item 2',  'Item 3', 'Item 4', 'Item 5', 'Item 6', 'Item 7', 'Item 8', 'Item 9', 'Item 10'];
container.innerHTML = textBtns.map(btn => { return ` <button  class="allbuttons" value="${btn}"  >${btn}</button> `}).join('');


function handleClick(e) {
if (e.target.matches('button')) {
    result.textContent = e.target.value;
    const buttons = container.querySelectorAll('button');
    buttons.forEach(button => button.classList.remove('black'));
    e.target.classList.add('black');
  }
}




</script>

</html>
