<!DOCTYPE html>
<html>
<head>
    <script src="index.js"></script>    
</head>
<style>
@charset "UTF-8";
*{margin: 0; }
body{cursor: Default;  padding:5px; display: flex; justify-content: center;}

.wrapper {
  position: absolute;
   width: 130px;
  height: 130px;
  flex-direction: column;
  display: flex;
  padding: 5px; 
  border: 1px solid #3e3e3e;
}

.sp-tabs {
  flex: 0 0 auto;
  display: flex;
  flex-direction: row;
  border-bottom: 2px solid #3E3E3E; 
}

.sp-tab {
  margin-right: 12px;
}
.sp-tab sp-label {
  color: rgba(255,255,255,0.75);
  font-family: Arial, Helvetica, sans-serif;
	font-size: 11px; 
}

.sp-tab:hover sp-label {
  color: white;
}

.sp-tab.selected {
  border-bottom: 4px solid rgb(239, 255, 8);
  margin-bottom: -2px;
}
.sp-tab.selected sp-label {
  color: white;
}
.sp-tab-page {
    display: none;
    flex: 1 1 auto;
    overflow: scroll;
    padding: 12px;
    flex-direction: row;
    justify-content: center;
}
.sp-tab-page.visible {
    display: flex;
}

</style>
<body>
    <div class="wrapper">
    <div class="sp-tabs">
      <div class="sp-tab selected" id="sp-spectrum-typography-tab"><sp-label>Estampa</sp-label></div>
      <div class="sp-tab" id="sp-spectrum-widgets-tab"><sp-label>Ajuste</sp-label></div>
    </div>

    <div class="sp-tab-page visible" id="sp-spectrum-typography-tab-page">
      <h2 style="color: aliceblue;">Estampa</h1>
    </div>

    <div class="sp-tab-page" id="sp-spectrum-widgets-tab-page">
      <h2 style="color: aliceblue;">Ajuste</h2>
    </div>
    </div>
</body>
</html>
