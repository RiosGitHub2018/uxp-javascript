     }

			padding: 2px;

		}	

		.btnMedio:hover{

			color: rgb(0, 0, 0);
		}

		.btnMedio:active{	
			background:#3e6c92;
			color: rgb(0, 0, 0);
			transform: translate(0px, 1px);

  		position: absolute;
