<!DOCTYPE html>
<html>
<head>

<style>
     .container{
		width: 130px;
		height: 100%; 
		margin: auto;
		display: flex;
		flex-direction: column;
		flex-wrap: wrap;
		justify-content: flex-start;
		align-items: center; 
		border: 1px solid rgb(119, 118, 118);
		padding: 1px;
	}

	.botoes{
		width: 100%;
		height: 25px;
		background-color: rgb(143, 63, 63); 
		display: flex;
		justify-content: center;
		align-items: center; 
		border: 1px solid black;
		border-top: 0px;
		position: relative;
	}

	.icon{
		display: flex;
		position: absolute;
		right: 7px;	top: 2px;
		justify-content: center;
		font-size: 15px; 
		color: aliceblue;
	}

	.titulo{
		display: flex;
		position: absolute;
		left: 7px;	top: 5px;
		justify-content: center;
		font-size: 15px; 
		font-family: Arial, Helvetica, sans-serif;
		font-size: 12px; 
		color: aliceblue;
	}

	.titulo:hover{	
		color: rgb(214, 250, 156);
	}

	.conteudo{
		width: 100%;
		height: 150px ;   
		background-color: rgb(37, 37, 37); 
		display: flex;
		justify-content: center;
		align-items: center; 
		color: rgb(219, 217, 217);
		border: 1px solid black;
	}

</style>
