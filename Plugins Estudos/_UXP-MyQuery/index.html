<!DOCTYPE html>
<html>
<head>
  <script src="js/myQuery.js"></script>
  <script src="main.js"></script> 
  <link rel="stylesheet" href="style.css">  
  
  <style>
    body{
     padding: 30px;
     cursor: default;
    }

   :root {
        --fonte-principal: Arial, sans-serif;
        --font-principal-cor: #c9c7c7;
        --font-azul-cor: #85b7e0;
        --font-Icons: UXPSfxIcon;
        --cor-normal-btn: linear-gradient(to bottom,#919191 1%, #919191 5%, #6f6f6f 5%,#676767 44%, #5d5d5d 100%);
        --cor-hover-btn:#aca8a8;
        --cor-active-btn:#3e6c92;
        --cor-borda-btn: 1px solid #232323;
        --cor-bordaClara: 1px solid #6e6d6d; 
        --cor-bordaDefalu: 1px solid #404040;
        --cor-borda-setas: 1px solid #6e6d6d;
        --cor-borda-aba: 1px solid #3a3939;
        --cor-bg-janela: #535353;
        --cor-bg-escuro: #424242;
        --cor-bg-medio: #525252;
       
        --cor-bg-btn-ativo-aba:#5c5b5b;
        --cor-bg-conteudo-aba: #5c5b5b;
    }

    .myCalsse{
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        width: 80px;
        height: 28px;
        color:aliceblue;
        background-color: rgb(148, 92, 139);
        border: 1px solid #000000;
        transform: translateY(2px);
    }
    .myCalsse2{
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        width: 80px;
        height: 30px;
        color:aliceblue;
        background-color: rgb(76, 76, 151);
        border: 1px solid #868686;
    }

    .painelBGescuro{
          width: 100%;
          background-color: var(--cor-bg-escuro); 
          border: var( --cor-borda); 
          display: flex;
          flex-direction: column; 
          align-items: end; 
          padding: 10px;
    }
    .btnMedio { 
          width: 100%;
          height: 20px;
          background: var(--cor-normal-btn);
          border: 1px solid #232323;   
          outline: none;
          color: #c9c7c7;  
          text-align: center;
          font-family: Arial, sans-serif;
          font-size: 11px;
          margin: 1px;
          padding: 2px;
          border-radius: 2px;
          line-height: 14px; /*Alina o texto verticalmente*/
    }	

    .btnMedio:hover{	
          background: var(--cor-hover-btn);;
          color: rgb(0, 0, 0);
    }

    .btnMedio:active{	
          background: var(--cor-active-btn);
          color: rgb(0, 0, 0);
          transform: translate(0px, 1px);
          border-top: 3px solid #232323;
      }

.painelTitulo {
		position: absolute;
		top: -1em;
		left: 5px;
		background-color: rgb(167, 167, 167);
		display: block;
		padding: 5px;
		font-family: Arial, Helvetica, sans-serif;
		font-size: 12px; 
	} 

  </style>
  
</head>
<body>
      <div id="bt01" class="myCalsse2">Modal</div>
</body>
</html>
