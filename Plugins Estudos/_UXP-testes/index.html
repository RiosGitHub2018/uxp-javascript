<!DOCTYPE html>
<html>
<head>

<style>

.container{
		width: 100%;
		height: 100%; 
		margin: auto;
		display: flex;
		flex-direction: column;
		flex-wrap: wrap;
		justify-content: flex-start;
		align-items: center; 
		border:  1px solid rgb(65, 65, 65); 
		padding: 10px;
		margin-top: 2px; 
		position: relative;
	}

	.ckeckbox {
		height: 100%;
		display: flex;
		justify-content: flex-start;
		font-family: Arial, Helvetica, sans-serif;
		color: rgb(212, 212, 212);
		font-size: 10px; 
		align-items: center; 
		margin-bottom: 5px;
	}

	.botoes{
		width: 100%;
		height: 25px;
		justify-content: center;
		font-family: Arial, Helvetica, sans-serif;
		color: rgb(212, 212, 212);
		font-size: 10px; 
		align-items: center; 
	}


	.container2{
		width: 100%;
		height: 100%; 
		display: flex;
		justify-content: center;
		align-items: center; 
		border:  1px solid rgb(65, 65, 65); 
		padding: 10px;
		margin-top: 10px; 
		position: relative;
	}




	

	.lista-btns-base{
       width: 205px;
       height: 22px;
       align-items: center;
       line-height:19px;
       color: rgb(255, 255, 255);
       border:  1px solid rgb(110, 109, 109); 
       padding-left: 9px ;
       background-color: #2d2e2e;
       border-radius: 3px; 
       position: relative;
       font-size: 11px;
     }
     .icon{
		display: flex;
		position: absolute;
		right: 7px;	top: 7px;
		justify-content: center;
		font-size: 15px; 
		color: aliceblue;
	}

     .lista{
        width: 100%;
        display:none;
        flex-direction: column;
        margin: auto;
        align-items: center;
     }

   .lista_btns{
       width: 200px;
       flex-direction: column;
       margin: auto;
       align-items: center;
       border:  1px solid rgb(58, 58, 58); 
       border-radius: 0px; 
       padding: 2px; 
       background-color: #3e3f3f;
       overflow-y: scroll; height: 125px;
    }

   .btns{
        width: 200px;
        height: 20px; 
        color: rgb(224, 220, 220);
        text-align: left;
        line-height: 15px;
        border-radius: 0px; 
        font-size: 10px;
        padding-left: 5px ;
        display: block;
     }

    .btns:hover{	
        background: #979797;
        color: rgb(0, 0, 0);
    }

    .clicado { 
        background-color:#979797;
        color: rgb(0, 0, 0);
        border: 1px solid rgb(0, 0, 0); 
    }




</style>


<body>

	<sp-action-button class="botoes" id="btn9">Camadas de texto</sp-action-button>

	<form> <select  id="mostrartxt" size="8" style="width: 130px;"></select></form>
