<style>

    .text-element {
        font-family: 'UXP PSfxIcons';
        font-size: 25px;
        color: #aca8a8;
        border-radius: 3px; 
        padding: 3px;
        height: 35px;
        margin: 2px;
        display: flex;
        align-items: center; 
     }
        
    @charset "UTF-8";
   *{margin: 30; }

     .interface{
        width: 90%;
        height: 100%; 
        margin: auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center; 
        padding: 10px;
        position: relative;
        cursor: default;
     }

     .conteudo{
		width: 100%;
		height: 100%; 
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center; 
		border:  1px solid rgb(65, 65, 65); 
		padding: 10px;
		position: relative;
		border-radius: 10px; 
	}

    .Paineis{
        width: 100%;
        height: 100%; 
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center; 
        border:  1px solid rgb(65, 65, 65); 
        padding: 8px;
        position: relative;
        border-radius: 5px; 
    }
     
     .Edit-text-config{
        width: 100%;
        height: 25px;
        margin: 0px;
        padding: 2px;
        background-color: #353434;
        border: none;
	}

    .Sliders-config{
        width: 200px;
        padding: 10px;
        align-items: center; 
        padding-top: 0px;
        padding-bottom: 0px;
        border:  1px solid rgb(68, 67, 67); 
        border-radius: 5px;
        background-color:#3d3c3c;
        margin: 2px;
    }

    .Painel-fonte-color{
        width: 200px;
        padding: 10px;
        display: flex;
        flex-direction: row;
        align-items: center; 
        justify-content:center;
        padding-top: 0px;
        padding-bottom: 0px;
        border:  1px solid rgb(68, 67, 67); 
    }

    .botaoColor {
		  background-color: #000;
          border:  1px solid rgb(68, 67, 67); 
		  cursor: pointer;
		  width: 40px;
		  height: 20px;
          margin: 5px
		}

    .btn-alinhar-txt { 
        width: 23px;
        height: 20px;
        outline: none;
        color: #d5d2d2;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 10px;
        margin: 1px;
        padding: 2px;
        /* border-radius: 2px; */
    }	

    .btn-alinhar-txt:hover{	
        background: #aca8a8;
        color: rgb(0, 0, 0);
    }

    .selecionado {
          background-color:#383838;
    }

</style>
