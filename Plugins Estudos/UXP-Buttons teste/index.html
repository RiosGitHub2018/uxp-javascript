<!DOCTYPE html>
<html>
<head>
    <script src="index.js"></script>    
    <link  href="css/style.css" rel="stylesheet" type="text/css">
</head>

<style>
	.btnPeqn {
		width: 30px;
		height: 19px;
		background: linear-gradient(to bottom,  #919191 1%, #919191 5%, #6f6f6f 5%,#676767 44%, #5d5d5d 100%);
		border: 1px solid #232323;
		outline: none;
		color: #d5d2d2;
		text-align: center;
		font-family: Arial, sans-serif;
		font-size: 10px;
		margin: 5px;
		padding: 2px;
		border-radius: 2px;
	}
	
	
	.btnPeqn:hover{	
		background: #aca8a8;
		color: rgb(0, 0, 0);
	}
	


	.btnPeqn:active{	
		background:#3e6c92;
		color: rgb(0, 0, 0);
		transform: translate(0px, 1px);
		border-top: 3px solid #232323;
	}
	

	.icon {
		  width: 30px;
		  height: 20px;
		  margin-right: 8px;
	}
	
	.icon:hover {
		fill: #ff0000; 
	}

	.text {
	  margin-left: 8px;
	}
</style>
</head>

<body>
<div class="btnPeqn">
  <img class="icon" src="fb-icon.svg" alt="Ícone">
</div>
</body>
</html>
