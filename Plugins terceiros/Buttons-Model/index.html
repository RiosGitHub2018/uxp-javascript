<!DOCTYPE html>

<style>
.darkGray {
    min-width: 0;
    position: relative;
    background:linear-gradient(to bottom, #999999 7.5%, #2c2c2c 100%);
    border-radius: 4px;
    display:inline-block;
    padding: 0 1em;
    color:#e6e6e6;
    font-family:Arial, Helvetica;
    font-size:11px;
    font-weight: normal;
    text-align: center;
    height:20px;
    line-height: 20px;
    vertical-align: middle;
}
.darkGray:before {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border: 1px solid black;
    border-radius: 4px;
}
.darkGray:after {
    position: absolute;
    top: 1px; left: 1px; right: 1px; bottom: 1px;
    border: 1px solid #7d7d7d30;
    border-radius: 3px;
}
.darkGray:hover {
    color: white;
	background:linear-gradient(to bottom, #000 7.5%, #2c2c2c 100%);
}
.darkGray:active { /* click effect */
    outline: 1px solid rgba(0,0,0,0); /* bug: force full update on click */
    background:linear-gradient(to top, #999999 7.5%, #2c2c2c 100%);    
}
.darkGray:focus { /* if you want a focus ring */
    outline: 3px solid rgba(64,172,255,0.75);
    outline-radius: 7px;
}
.darkGray svg { /* position the icon */
    fill: currentColor;
    width: 0px; height: 0px;
    display: inline-block;
    vertical-align: middle;
    position: relative;
    top: -1px;
    margin-right: 1em;
}
</style>
