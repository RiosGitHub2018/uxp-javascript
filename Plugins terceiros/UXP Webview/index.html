<!DOCTYPE html>
<html>

<head>
  <script src="scripts.js"></script>
</head>
<style>
  .wrapper {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }

  .wrapper>* {
    flex: 0 0 auto;
    margin: 4px 0;
  }

  .row {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
  }

  .row>* {
    margin: 0 8px;
  }

  .row>*:first-child {
    margin-left: 0;
  }

  .row>*:last-child {
    margin-right: 0;
  }

  .row sp-textfield,
  .row sp-checkbox,
  .row sp-detail {
    flex: 1 1 auto;
  }

  .row sp-button {
    flex: 0 0 auto;
  }

  #logWebview {
    background: var(--uxp-host-widget-hover-background-color);
    padding: 14px;
    border-radius: 4px;
    border: 1px solid var(--uxp-host-widget-hover-border-color);
    font-family: 'Source Code Pro', 'Menlo', 'Courier New', Courier, monospace;
    white-space: pre-wrap;
  }
  #note {
    font-weight: lighter !important;
    font-size: xx-small;
    margin-left: 5px;
  }
  .infoRow {
    display: flex;
    flex-direction: row;
    align-items: baseline;
  }
</style>

<body>
  <div class="wrapper">
    <sp-detail style="margin-top: 30px;">Starter Plugin for loading WebView</sp-detail>
    <sp-divider></sp-divider>
    <div class="row">
      <sp-action-button id="openDialog">Show WebView</sp-action-button>
    </div>
    <div class="infoRow">
      <sp-icon name="ui:InfoSmall" size="s" class="icon" style="color: grey;"></sp-icon>
      <sp-detail size="xs" id="note">WebViews are supported only within dialogs.</sp-detail>
      </div>
      <sp-detail style="margin-top: 30px;">Response from WebView</sp-detail> 
      <sp-divider></sp-divider>
      <sp-body id="logWebview"></sp-body>
      <sp-detail>Snapshot from WebView</sp-detail>
      <img id="testImg" width="200" height="200" src=""></img>
      <sp-divider></sp-divider>
</div>
    
    <dialog id="webViewDialog" width="600px">
      <sp-heading style="font-size: medium;">WebView</sp-heading>
      <sp-divider size="medium"></sp-divider> 
      <webview style="border: 2px solid black;" id="webviewSample" width="100%" height="500px" style="margin-top:10px;" src="http://127.0.0.1:7724" uxpAllowInspector="true"></webview>
      <sp-divider size="medium"></sp-divider> 
      <div class="row">
        <sp-action-button style="margin-top:10px; margin-bottom:10px; margin-left:100px;" id="2DBtn">Create WebGL Triangle</sp-action-button>
        <sp-action-button style="margin-top:10px; margin-bottom:10px; margin-left:20px;" id="2DBtnTriangle">Apply Transforms on Triangle</sp-action-button>
      </div>
      
      <textarea id="log" type="textarea" width="100%" height="50px"></textarea>

    </dialog> 
</body>
</html>
